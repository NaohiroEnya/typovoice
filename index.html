<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>TYPO VOICE</title>
    <meta name="description" content="声が文字になって、空間に浮かぶ。ARボイスメッセージ">

    <!-- 8th Wall, exactly as in TYPO CAM. Versions pinned exactly (not "@1") so jsdelivr never
         needs to re-resolve against the npm registry at runtime. -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1.0.0/dist/landing-page.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="src/index.css">
  </head>
  <body>
    <!-- The main canvas used for drawing by the app; also the source frame for recordings. -->
    <canvas id="camerafeed"></canvas>

    <!-- Everything below is DOM on top of the canvas, so it never ends up in recordings. -->
    <div id="ui">
      <span id="rec-badge" hidden>REC</span>

      <button id="clear" class="glass-button" type="button" aria-label="文字をすべて消す" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </button>

      <div id="voice-bar">
        <p id="voice-tag"></p>
        <div id="color-row" role="group" aria-label="文字の色を選ぶ" hidden></div>
        <p id="hint">タップして話す</p>
        <div id="mic-row">
          <button id="color-open" class="glass-button" type="button" aria-label="文字の色" aria-expanded="false">
            <span id="color-dot"></span>
          </button>
          <button id="mic" type="button" aria-label="話す">
            <span id="mic-level"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <!-- The latest recorded message; invisible (but keeping the mic centered) until there is one. -->
          <button id="clip-open" class="glass-button is-empty" type="button" aria-label="録画したメッセージを見る">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Fallback for browsers without speech recognition: type the message instead. -->
    <form id="type-form" hidden>
      <input id="type-input" type="text" maxlength="40" placeholder="メッセージを入力" autocomplete="off" enterkeyhint="send" aria-label="メッセージ">
      <button type="submit" class="solid-pill">出す</button>
    </form>

    <!-- The latest recording, with ways to send it. -->
    <div id="result" hidden>
      <video id="result-video" playsinline loop controls></video>
      <div id="result-actions">
        <button id="result-send" type="button" class="solid-pill">動画を送る・保存</button>
        <button id="result-link" type="button" class="glass-button glass-pill">リンクで送る</button>
        <button id="result-close" type="button" class="link-button">閉じる</button>
      </div>
    </div>

    <!-- Opened from someone's message link. -->
    <div id="inbox" hidden>
      <p class="inbox-title">声のメッセージが届きました</p>
      <p id="inbox-text"></p>
      <p id="inbox-label"></p>
      <button id="inbox-place" type="button" class="solid-pill">空間に出す</button>
    </div>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
